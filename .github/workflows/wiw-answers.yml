name: Why It Works - answers and comments

on:
  schedule:
    - cron: "29 */2 * * *"     # every 2 hours, at minutes the main channel's clocks do not use
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: studio-wiw     # the student channel's lane: never overlaps its daily run's save
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    env:
      STUDIO_CHANNEL: wiw
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The LATEST main, not the commit from when this run was queued: a run queued behind
          # another (studio-state) started from stale state on 12 Nov and its save erased two videos.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Write sign-in files from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          TOKEN_JSON_WIW: ${{ secrets.TOKEN_JSON_WIW }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
          printf '%s' "$TOKEN_JSON_WIW" > token_wiw.json

      - name: Post answers, draft comment replies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # free key: research sources (empty = keyless, 1,000 credits a day)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python studio.py hourly

      - name: Save state
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/wiw/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: wiw answers $(date -u +%FT%H%M)"
          git pull --rebase -X theirs -q || { git rebase --abort; git pull --no-rebase -X ours -q --no-edit; } || true
          git push -q || true
