name: Aakhir Kyun? (Hindi) - daily

# The Hindi channel (STUDIO_CHANNEL=hi): same engine, channels/hi.json, data/hi/, the
# video-bank-hi release, sign-in TOKEN_JSON_HI. Until that secret exists it makes and banks videos only.
on:
  schedule:   # 07:11, 14:41 and 18:41 IST (switched on 16 Nov 2026, channel signed in)
    - cron: "41 1 * * *"
    - cron: "11 9 * * *"
    - cron: "11 13 * * *"
  workflow_dispatch: {}
  push:   # a start button with no browser: change kick/hi.txt (GitHub sometimes skips a schedule)
    branches: [main]
    paths: ["kick/hi.txt"]

permissions:
  contents: write

concurrency:
  group: studio-hi
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # Chatterbox Hindi narration (17 Nov 2026)
    env:
      STUDIO_CHANNEL: hi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          if pip install -q imageio-ffmpeg==0.7.0; then
            sudo cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
            sudo chmod +x /usr/local/bin/ffmpeg
          fi
          if ! command -v ffmpeg >/dev/null; then
            timeout 300 bash -c 'sudo apt-get update -q -o Acquire::Retries=2 && sudo apt-get install -y -q ffmpeg'
          fi
          ffmpeg -version | head -1

      - name: Manim (unused on the Hindi channel for now; kept so the pipeline is identical)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          timeout 420 bash -c 'sudo apt-get install -y -q libcairo2-dev libpango1.0-dev pkg-config' || \
            timeout 420 bash -c 'sudo apt-get update -q && sudo apt-get install -y -q libcairo2-dev libpango1.0-dev pkg-config'
          pip install -q manim
          manim --version

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: faster-whisper, for the listening check (optional; QA skips it without)
        continue-on-error: true
        timeout-minutes: 5
        run: pip install -q "faster-whisper==1.2.1"

      - name: Keep the Kokoro voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voices-kokoro-chatterbox-mtl-v1

      - name: Install the Kokoro voice (open source; the Edge voice is the fallback)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Install Chatterbox (the owner's own voice speaking Hindi; Swara is the back-up)
        continue-on-error: true
        timeout-minutes: 10
        run: pip install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Write sign-in files from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          TOKEN_JSON_HI: ${{ secrets.TOKEN_JSON_HI }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json          # the daily report goes out on the main sign-in
          if [ -n "$TOKEN_JSON_HI" ]; then printf '%s' "$TOKEN_JSON_HI" > token_hi.json; else
            echo "TOKEN_JSON_HI not set yet: videos are made and banked, not published"; fi

      - name: Unlock the owner's voice (only the encrypted copy is in the public repo)
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          if [ -n "$VOICE_KEY" ]; then
            printf '%s' "$VOICE_KEY" > "$RUNNER_TEMP/vk"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in assets/voice/owner.wav.enc -out assets/voice/owner.wav -pass "file:$RUNNER_TEMP/vk" && echo "voice unlocked" || echo "VOICE_KEY does not open the sample"
            rm -f "$RUNNER_TEMP/vk"
          else echo "no VOICE_KEY secret yet: Chatterbox's own voice reads English, Swara reads Hindi"; fi

      - name: Make, fact-check, bank, publish when due
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # free key: research sources (empty = keyless, 1,000 credits a day)
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}   # optional: 10,000 idea lookups a day instead of 300
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          PUBLISH_MODE: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_BUDGET_MIN: "95"
          PYTHONUNBUFFERED: "1"
          # no Cloudflare keys here on purpose: this channel draws with code, and the free daily
          # drawing allowance stays with the main channel
        run: |
          mkdir -p data/hi
          python studio.py daily
          python studio.py learn || true

      - name: Keep the videos for 7 days (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-hi
          path: |
            jobs/hi/*/final.mp4
            jobs/hi/*/thumbnail*.jpg
            jobs/hi/*/review.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Save what the agents learned
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/hi/*.json 2>/dev/null || true
          git add -f research/LIBRARY_hi.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: hi daily run $(date -u +%F)"
          git pull --rebase -X theirs -q || { git rebase --abort; git pull --no-rebase -X ours -q --no-edit; } || true
          git push -q || true
