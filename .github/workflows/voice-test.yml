name: Voice test

# A manual listening check of the narrator: one short sample script read by Kokoro sentence by
# sentence (natural pauses, questions that rise), saved to research/voice_test/ with the pause
# measurements, so a person can listen before it reaches a real video.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          pip install -q imageio-ffmpeg==0.7.0
          sudo cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Keep the Kokoro voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install the Kokoro voice
        timeout-minutes: 10
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Read the sample
        env:
          PYTHONUNBUFFERED: "1"
        run: python studio.py voice-test

      - name: Save the sample
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f research/voice_test || true
          git diff --cached --quiet || git commit -m "test: narrator sample $(date -u +%F)"
          git pull --rebase -X theirs -q || true
          git push -q || true
