name: Answers and comments

on:
  schedule:
    - cron: "41 */2 * * *"     # every 2 hours (odd minute: GitHub skips busy top-of-hour runs): post the enquiry answer once a video is public
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # lets the health agent start a catch-up production run

concurrency:
  group: studio-state
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Write sign-in files from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Post answers, draft comment replies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python studio.py hourly

      - name: Save state
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.json STATUS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: answers $(date -u +%FT%H%M)"
          git pull --rebase -q || true
          git push -q || true
