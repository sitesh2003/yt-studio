name: Weekly long video

on:
  schedule:
    - cron: "37 3 * * 6"       # Saturday 03:37 UTC = 9:07 AM IST (odd minute: fewer skipped runs); it goes public Saturday 10 AM US Eastern
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # lets the health agent start a catch-up production run

concurrency:
  group: studio-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          # GitHub's Ubuntu mirror hung 30+ minutes on 11 Nov: give it 3 minutes, then retry from
          # Ubuntu's main official archive instead of the mirror.
          if ! timeout 180 bash -c 'sudo apt-get update -q -o Acquire::Retries=2 && sudo apt-get install -y -q ffmpeg'; then
            echo "mirror stuck, switching to archive.ubuntu.com"
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            timeout 300 bash -c 'sudo apt-get update -q -o Acquire::Retries=3 && sudo apt-get install -y -q ffmpeg'
          fi
          ffmpeg -version | head -1

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Write sign-in files from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Write, fact-check, render and schedule the weekly episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          PUBLISH_MODE: auto
          PYTHONUNBUFFERED: "1"
        run: python studio.py weekly

      - name: Keep the episode for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-episode
          path: |
            jobs/*/final.mp4
            jobs/*/thumbnail*.jpg
            jobs/*/review.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.json STATUS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: weekly $(date -u +%F)"
          git pull --rebase -q || true
          git push -q || true
