name: Illustration test

# A manual check that the Cloudflare keys work and the drawings are good enough: draws three sample
# scenes, runs the accuracy check on each, and saves the pictures and scores to research/illustration_test/.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: studio-state
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Draw and check three scenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python studio.py illustrate-test

      - name: Save the pictures
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f research/illustration_test data/illustrate_usage.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "test: illustration samples $(date -u +%F)"
          git pull --rebase -X theirs -q || true
          git push -q || true
