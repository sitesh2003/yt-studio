name: Why It Works - daily

# The student channel (STUDIO_CHANNEL=wiw): same engine, its own settings (channels/wiw.json),
# memory (data/wiw/), bank (the "video-bank-wiw" release) and sign-in (TOKEN_JSON_WIW secret).
# Until that secret exists it still makes, checks and banks videos; publishing starts once it is set.
# Runs at hours the main channel does not use, so the two never compete for the free AI models.
on:
  schedule:
    - cron: "23 0 * * *"       # 5:53 AM IST
    - cron: "53 5 * * *"       # 11:23 AM IST
    - cron: "23 10 * * *"      # 3:53 PM IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: studio-wiw
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      STUDIO_CHANNEL: wiw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          if pip install -q imageio-ffmpeg==0.7.0; then
            sudo cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
            sudo chmod +x /usr/local/bin/ffmpeg
          fi
          if ! command -v ffmpeg >/dev/null; then
            timeout 300 bash -c 'sudo apt-get update -q -o Acquire::Retries=2 && sudo apt-get install -y -q ffmpeg'
          fi
          ffmpeg -version | head -1

      - name: Manim, for the code-drawn animations this channel leads with
        continue-on-error: true
        timeout-minutes: 12
        run: |
          timeout 420 bash -c 'sudo apt-get install -y -q libcairo2-dev libpango1.0-dev pkg-config' || \
            timeout 420 bash -c 'sudo apt-get update -q && sudo apt-get install -y -q libcairo2-dev libpango1.0-dev pkg-config'
          pip install -q manim
          manim --version

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: faster-whisper, for the listening check (optional; QA skips it without)
        continue-on-error: true
        timeout-minutes: 5
        run: pip install -q "faster-whisper==1.2.1"

      - name: Keep the Kokoro voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Install the Kokoro voice (open source; the Edge voice is the fallback)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Write sign-in files from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          TOKEN_JSON_WIW: ${{ secrets.TOKEN_JSON_WIW }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json          # the daily report goes out on the main sign-in
          if [ -n "$TOKEN_JSON_WIW" ]; then printf '%s' "$TOKEN_JSON_WIW" > token_wiw.json; else
            echo "TOKEN_JSON_WIW not set yet: videos are made and banked, not published"; fi

      - name: Make, fact-check, bank, publish when due
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # free key: research sources (empty = keyless, 1,000 credits a day)
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}   # optional: 10,000 idea lookups a day instead of 300
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          PUBLISH_MODE: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_BUDGET_MIN: "95"
          PYTHONUNBUFFERED: "1"
          # no Cloudflare keys here on purpose: this channel draws with code, and the free daily
          # drawing allowance stays with the main channel
        run: |
          mkdir -p data/wiw
          python studio.py daily
          python studio.py learn || true

      - name: Keep the videos for 7 days (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-wiw
          path: |
            jobs/wiw/*/final.mp4
            jobs/wiw/*/thumbnail*.jpg
            jobs/wiw/*/review.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Save what the agents learned
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/wiw/*.json 2>/dev/null || true
          git add -f research/LIBRARY_wiw.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: wiw daily run $(date -u +%F)"
          git pull --rebase -X theirs -q || { git rebase --abort; git pull --no-rebase -X ours -q --no-edit; } || true
          git push -q || true
