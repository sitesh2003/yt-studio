name: Daily videos

on:
  schedule:
    # VIDEO BANK: three production runs a day at GitHub's quiet hours (US night, odd minutes).
    # Each run tops the bank up to 2 days of scheduled videos and does nothing if it is full,
    # so a skipped or failed run never leaves the channel without its 3 videos.
    - cron: "43 21 * * *"      # 3:13 AM IST
    - cron: "47 3 * * *"       # 9:17 AM IST
    - cron: "17 7 * * *"       # 12:47 PM IST
  workflow_dispatch: {}         # "Run workflow" button for a manual run

permissions:
  contents: write
  actions: write        # lets the health agent start a catch-up production run

concurrency:
  group: studio-state
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          # From PyPI (the same source as our other packages): a full static FFmpeg with captions
          # (libass), x264 and fonts. Ubuntu's apt mirrors hung for over an hour on 11 Nov, so apt
          # is only the back-up now.
          if pip install -q imageio-ffmpeg==0.7.0; then
            sudo cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
            sudo chmod +x /usr/local/bin/ffmpeg
          fi
          if ! ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass "; then
            echo "PyPI FFmpeg unavailable, trying apt"
            timeout 300 bash -c 'sudo apt-get update -q -o Acquire::Retries=2 && sudo apt-get install -y -q ffmpeg'
          fi
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep " ass "

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      - name: Write sign-in files from secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Make, fact-check, upload (private + scheduled)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          PUBLISH_MODE: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_BUDGET_MIN: "95"   # stop starting new videos after this, so the report always goes out
          PYTHONUNBUFFERED: "1"
        run: |
          python studio.py daily
          python studio.py learn || true

      - name: Keep the videos for 7 days (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            jobs/*/final.mp4
            jobs/*/thumbnail*.jpg
            jobs/*/review.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Save what the agents learned
        if: always()
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.json STATUS.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: daily run $(date -u +%F)"
          git pull --rebase -X theirs -q || { git rebase --abort; git pull --no-rebase -X ours -q --no-edit; } || true
          git push -q || true
