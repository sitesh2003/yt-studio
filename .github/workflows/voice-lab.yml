name: Voice lab (emotion test)

# A manual listening test (16 Nov 2026): today's Kokoro narrator vs Chatterbox (MIT, open source) at two emotion
# strengths, same lines. Saves research/voice_lab/*.mp3 + timings.txt. Never touches a real video.
on:
  workflow_dispatch: {}
  push:   # also runs when the lab script itself changes (no browser click needed)
    branches: [main]
    paths: ["tools/voice_lab.py"]

permissions:
  contents: write

concurrency:
  group: voice-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          pip install -q imageio-ffmpeg==0.7.0
          sudo cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg

      - name: Keep voice models between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-lab-models-v1

      - name: Voice options (every voice, the same lines, real-video pauses)
        timeout-minutes: 30
        if: github.event_name == 'workflow_dispatch'   # done 16 Nov; its samples are saved
        run: |
          python -m venv /tmp/kk && . /tmp/kk/bin/activate
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile en-core-web-sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          pip install -q edge-tts
          sudo apt-get install -y -q espeak-ng > /dev/null 2>&1 || true   # Kokoro's Hindi voices read through espeak
          pip install -q "misaki[hi]" || true
          python tools/voice_lab.py research/voice_lab options

      - name: Hindi round 2 (quicker Edge voices + Chatterbox speaking Hindi)
        timeout-minutes: 45
        continue-on-error: true
        run: |
          python -m venv /tmp/h2 && . /tmp/h2/bin/activate
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts soundfile edge-tts --extra-index-url https://download.pytorch.org/whl/cpu
          python tools/voice_lab.py research/voice_lab hindi2

      - name: Chatterbox lively, every word checked by ear
        timeout-minutes: 50
        if: github.event_name == 'workflow_dispatch'   # its samples are already saved
        continue-on-error: true
        run: |
          python -m venv /tmp/cb && . /tmp/cb/bin/activate
          pip install -q chatterbox-tts soundfile faster-whisper
          python tools/voice_lab.py research/voice_lab checked

      - name: Save the samples
        if: always()
        run: |
          cd research/voice_lab
          for f in *.wav; do [ -f "$f" ] && ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3" && rm "$f"; done
          cd ../..
          git config user.name "yt-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f research/voice_lab || true
          git diff --cached --quiet || git commit -m "lab: narrator emotion samples $(date -u +%F)"
          git pull --rebase -X theirs -q || true
          git push -q || true
