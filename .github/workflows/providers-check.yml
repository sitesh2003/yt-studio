name: Free keys check

# 20 Nov 2026: one tiny request per free provider (Groq, OpenRouter, Mistral, Cloudflare, Kaggle) to prove
# each secret works. Prints only OK / FAIL, never a key. Saves research/providers_check.txt.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["kick/providers-check.txt"]

permissions:
  contents: write

concurrency:
  group: providers-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q requests python-dotenv six "kaggle>=1.8"
      - name: Check each key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python tools/providers_check.py
      - name: Save the result
        run: |
          git config user.name "yt-studio-bot"
          git config user.email "yt-studio-bot@users.noreply.github.com"
          git add research/providers_check.txt
          git commit -m "research: free keys check" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
