name: Hero Short 3D render (split across machines)

# 20 Nov 2026: renders a hand-made 3D hero Short fully online at the SAME quality as the laptop (1080x1920,
# motion blur; never lowered, owner). GitHub machines have no graphics card: ~50 s a frame, so a whole shot
# on one machine hit the 2-hour limit. Each shot is cut into 15-frame pieces, one machine each (~13 min),
# GitHub runs 20 at a time, so a 35 s Short takes about an hour. A last job joins the
# frames, draws the graphics and captions, mixes the sound and saves research/hero/<name>/<name>.mp4.
# Blender is the official 5.1 build (the same version the laptop renders with), so both give the same picture.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "hero folder under research/hero"
        default: "trex"
  push:
    branches: [main]
    paths: ["kick/hero-render.txt"]

permissions:
  contents: write

concurrency:
  group: hero-render
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.p.outputs.name }}
      pieces: ${{ steps.p.outputs.pieces }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          N="${{ github.event.inputs.name }}"; [ -z "$N" ] && N="$(head -1 kick/hero-render.txt | tr -d '\r')"
          echo "name=$N" >> "$GITHUB_OUTPUT"
          python - "$N" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          sp = json.load(open(f"research/hero/{sys.argv[1]}/spec.json"))
          out = []
          for i, sh in enumerate(sp["shots"]):
              n = int(round(sh["seconds"] * 30))
              out += [{"shot": i, "a": a, "b": min(n, a + 14)} for a in range(1, n + 1, 15)]
          print("pieces=" + json.dumps(out))
          PY

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        p: ${{ fromJson(needs.plan.outputs.pieces) }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep Blender between runs
        id: bl
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.1.0-linux
      - name: Official Blender 5.1.0
        if: steps.bl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sL https://download.blender.org/release/Blender5.1/blender-5.1.0-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
      - name: Libraries Blender needs on a bare machine
        run: timeout 600 bash -c 'sudo apt-get update -q && sudo apt-get install -y -q xvfb libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6' || true
      - name: Render shot ${{ matrix.shot }}
        run: |
          xvfb-run -a ~/blender/blender -b --disable-autoexec --python tools/blender/hero/shots.py -- \
            --spec research/hero/${{ needs.plan.outputs.name }}/spec.json --shot ${{ matrix.shot }} \
            --out frames/s${{ matrix.shot }} 2>&1 | grep -E "natural|rendered|Error|Traceback|line [0-9]+" ; test -n "$(ls frames/s${{ matrix.shot }})"
      - uses: actions/upload-artifact@v4
        with:
          name: shot-${{ matrix.shot }}
          path: frames/s${{ matrix.shot }}
          retention-days: 3

  compose:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: FFmpeg with captions (libass)
        run: |
          pip install -q imageio-ffmpeg==0.7.0
          sudo cp "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg
          pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: frames
      - name: Join, graphics, captions, sound
        run: |
          # piece-<shot>-<first frame> folders -> frames/s<shot>/ (frame files are numbered, so pieces just merge)
          for d in frames/piece-*; do s=$(echo "$d" | cut -d- -f2); mkdir -p "frames/s$s"; mv "$d"/*.png "frames/s$s/"; rmdir "$d"; done
          N="${{ needs.plan.outputs.name }}"; CH=main; case "$N" in *_hi) CH=hi;; *_wiw) CH=wiw;; esac
          STUDIO_CHANNEL=$CH python tools/blender/hero/compose.py "$N" frames
      - name: Keep the video as a download (videos are never committed: too large for the repo)
        uses: actions/upload-artifact@v4
        with:
          name: hero-${{ needs.plan.outputs.name }}
          path: research/hero/${{ needs.plan.outputs.name }}/${{ needs.plan.outputs.name }}.mp4
          retention-days: 14
